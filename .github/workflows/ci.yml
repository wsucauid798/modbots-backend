name: Backend CI

on:
  push:
    branches:
      - main
      - release/v0.0.1-alpha
  pull_request:
    branches:
      - main
      - release/v0.0.1-alpha
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify backend
    runs-on: ubuntu-latest

    steps:
      - name: Check out backend repo
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Set up Rust
        run: |
          rustup toolchain install 1.93.0 --profile minimal
          rustup default 1.93.0

      - name: Build backend
        run: npm run build

      - name: Test backend
        run: npm test
