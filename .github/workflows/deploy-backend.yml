name: Production Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-production-diagnostics
  cancel-in-progress: false

env:
  PRODUCTION_HOST: 77.68.50.14
  PRODUCTION_SSH_USER: wsawyerr

jobs:
  diagnose:
    name: Diagnose production runtime
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Configure SSH
        env:
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$PRODUCTION_SSH_KEY" > ~/.ssh/modbots-production
          chmod 600 ~/.ssh/modbots-production
          ssh-keyscan -H "$PRODUCTION_HOST" >> ~/.ssh/known_hosts

      - name: Read production runtime diagnostics
        run: |
          ssh -i ~/.ssh/modbots-production "$PRODUCTION_SSH_USER@$PRODUCTION_HOST" <<'EOF'
          set -eu
          echo '=== CPU ==='
          lscpu | grep -E 'Model name|CPU\(s\)|Thread|Core|Socket'
          echo '=== MEMORY ==='
          free -h
          echo '=== LOAD ==='
          cat /proc/loadavg
          echo '=== MODEL CONFIGURATION ==='
          docker model configure show ai/gemma4
          echo '=== RUNNING MODELS ==='
          docker model ps
          echo '=== LLAMA.CPP RUNTIME ==='
          docker model logs ai/gemma4 2>&1 | grep -E 'n_ctx|n_parallel|slots|cache state|print_timing|CPU|Vulkan|CUDA|offload' | tail -n 200 || true
          EOF
