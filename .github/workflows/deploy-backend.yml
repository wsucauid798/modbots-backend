name: Production Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-production-diagnostics
  cancel-in-progress: false

env:
  PRODUCTION_HOST: 77.68.50.14
  PRODUCTION_SSH_USER: wsawyerr

jobs:
  diagnose:
    name: Diagnose production runtime
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Configure SSH
        env:
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$PRODUCTION_SSH_KEY" > ~/.ssh/modbots-production
          chmod 600 ~/.ssh/modbots-production
          ssh-keyscan -H "$PRODUCTION_HOST" >> ~/.ssh/known_hosts

      - name: Read production runtime diagnostics
        run: |
          ssh -i ~/.ssh/modbots-production "$PRODUCTION_SSH_USER@$PRODUCTION_HOST" <<'EOF'
          set -eu
          echo '=== CPU ==='
          lscpu | grep -E 'Model name|CPU\(s\)|Thread|Core|Socket'
          echo '=== MEMORY ==='
          free -h
          echo '=== LOAD ==='
          cat /proc/loadavg
          echo '=== INFERENCE CONFIGURATION ==='
          docker inspect modbots-backend-ml \
            --format '{{range .Config.Env}}{{println .}}{{end}}' \
            | grep -E '^(MODEL_BACKEND|MODEL_URL|MODEL_ID|INFERENCE_TIMEOUT_SECONDS)=' || true
          echo '=== INFERENCE HEALTH ==='
          docker exec modbots-backend-ml python -c "import urllib.request; print(urllib.request.urlopen('http://localhost:8000/health', timeout=10).read().decode())" || true
          echo '=== INFERENCE LOGS ==='
          docker logs --tail 200 modbots-backend-ml 2>&1 || true
          EOF
