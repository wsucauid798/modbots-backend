name: modbots-backend

services:
  api:
    image: modbots-backend-api:local
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: modbots-backend-api
    restart: unless-stopped
    environment:
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-3001}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-modbots}
      POSTGRES_USER: ${POSTGRES_USER:-modbots}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-modbots}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-modbots}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      MODERATION_MIN_CONFIDENCE: ${MODERATION_MIN_CONFIDENCE:-0.9}
      MODERATION_ALLOWED_ACTIONS: ${MODERATION_ALLOWED_ACTIONS:-delete_message,mute_actor,unmute_actor,remove_actor}
      AUTH_MODE: ${AUTH_MODE:-optional}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      ACCOUNT_URL: ${ACCOUNT_URL:-http://account:3003}
      TRANSLATION_URL: ${TRANSLATION_URL:-http://translation:5000}
      UPPS_PUBLIC_URL: ${UPPS_PUBLIC_URL:-http://localhost:3010}
      UPPS_INTERNAL_URL: http://upps:3010
      UPPS_SERVICE_TOKEN: ${UPPS_SERVICE_TOKEN:-dev-only-upps-service-token-change-me}
      WEB_ORIGINS: ${WEB_ORIGINS:-http://localhost:3000}
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      nats:
        condition: service_started
      minio:
        condition: service_started
      upps:
        condition: service_started
      translation:
        condition: service_healthy

  realtime:
    image: modbots-backend-realtime:local
    build:
      context: ./services/realtime
      dockerfile: Dockerfile
    container_name: modbots-backend-realtime
    restart: unless-stopped
    environment:
      BACKEND_URL: http://api:${PORT:-3001}
      NATS_URL: nats://nats:4222
      WEBSOCKET_PORT: 3002
      WEBTRANSPORT_PORT: 4433
      PUBLIC_WEBTRANSPORT_URL: https://127.0.0.1:4433/v1/rooms/{roomId}
    ports:
      - "3002:3002"
      - "4433:4433/udp"
    depends_on:
      api:
        condition: service_started
      nats:
        condition: service_started

  runtime:
    image: modbots-runtime:local
    build:
      context: .
      dockerfile: services/runtime/Dockerfile
    container_name: modbots-backend-runtime
    restart: unless-stopped
    environment:
      MODBOTS_API_URL: http://api:${PORT:-3001}
      MODBOTS_REALTIME_URL: ws://realtime:3002
      MODBOTS_ROOM_ID: global-lobby
      CHAT_TEMPO: ${CHAT_TEMPO:-1}
      HUMAN_ACTIVITY_WINDOW_MINUTES: ${HUMAN_ACTIVITY_WINDOW_MINUTES:-15}
      AUTONOMOUS_INFERENCE_LIMIT_PER_HOUR: ${AUTONOMOUS_INFERENCE_LIMIT_PER_HOUR:-12}
      ML_URL: http://ml:8000
    depends_on:
      api:
        condition: service_started
      realtime:
        condition: service_started
      ml:
        condition: service_started

  account:
    image: modbots-account:local
    build:
      context: .
      dockerfile: services/account/Dockerfile
    container_name: modbots-backend-account
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3003
      BACKEND_URL: http://api:${PORT:-3001}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      ACCOUNT_ISSUER: ${ACCOUNT_ISSUER:-http://localhost:3003}
      COOKIE_SECRET: ${COOKIE_SECRET:-dev-only-cookie-secret-change-me}
      DESKTOP_REDIRECT_URI: ${DESKTOP_REDIRECT_URI:-http://127.0.0.1:53682/callback}
      WEB_REDIRECT_URI: ${WEB_REDIRECT_URI:-http://localhost:3000/login/callback}
    ports:
      - "3003:3003"
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_started

  upps:
    image: modbots-upps:local
    build:
      context: .
      dockerfile: services/upps/Dockerfile
    container_name: modbots-backend-upps
    restart: unless-stopped
    environment:
      MODBOTS_UPPS_HOST: 0.0.0.0
      MODBOTS_UPPS_PORT: 3010
      MODBOTS_UPPS_SERVICE_TOKEN: ${UPPS_SERVICE_TOKEN:-dev-only-upps-service-token-change-me}
    ports:
      - "3010:3010"
    volumes:
      - upps-profile-pictures:/app/services/upps/public/profile-pictures/uploads

  ml:
    image: modbots-ml:local
    build:
      context: ./services/ml
      dockerfile: Dockerfile
    container_name: modbots-backend-ml
    restart: unless-stopped
    environment:
      MODEL_ID: ${MODEL_ID:?Set MODEL_ID to the hosted model to run}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY}
      INFERENCE_TIMEOUT_SECONDS: ${INFERENCE_TIMEOUT_SECONDS:-120}
    ports:
      - "8000:8000"

  translation-models-init:
    image: libretranslate/libretranslate:v1.9.6
    container_name: modbots-backend-translation-models-init
    user: "0:0"
    entrypoint:
      [
        "sh",
        "-c",
        "mkdir -p /home/libretranslate/.local/share/argos-translate && chown -R 1032:1032 /home/libretranslate/.local/share/argos-translate",
      ]
    volumes:
      - translation-models:/home/libretranslate/.local/share/argos-translate
    restart: "no"

  translation:
    image: libretranslate/libretranslate:v1.9.6
    container_name: modbots-backend-translation
    restart: unless-stopped
    environment:
      LT_HOST: 0.0.0.0
      LT_PORT: 5000
      LT_LOAD_ONLY: en,zh
      LT_DISABLE_WEB_UI: "true"
      LT_DISABLE_FILES_TRANSLATION: "true"
      LT_CHAR_LIMIT: 40000
      LT_BATCH_LIMIT: 50
    volumes:
      - translation-models:/home/libretranslate/.local/share/argos-translate
    depends_on:
      translation-models-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/languages', timeout=5)",
        ]
      interval: 10s
      timeout: 6s
      retries: 30
      start_period: 60s

  postgres:
    image: postgres:17-alpine
    container_name: modbots-backend-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-modbots}
      POSTGRES_USER: ${POSTGRES_USER:-modbots}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-modbots}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-modbots} -d ${POSTGRES_DB:-modbots}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: modbots-backend-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  nats:
    image: nats:2.11-alpine
    container_name: modbots-backend-nats
    restart: unless-stopped
    command: ["-js", "--store_dir", "/data", "--http_port", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data

  minio:
    image: minio/minio:RELEASE.2025-06-13T11-33-47Z
    container_name: modbots-backend-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  redis-data:
  nats-data:
  minio-data:
  upps-profile-pictures:
  translation-models:

