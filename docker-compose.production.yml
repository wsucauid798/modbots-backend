name: modbots-backend

services:
  api:
    image: ghcr.io/mod-bots/modbots-backend-api:${MODBOTS_IMAGE_TAG:-0.0.1-beta}
    container_name: modbots-backend-api
    restart: unless-stopped
    environment:
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-3001}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-modbots}
      POSTGRES_USER: ${POSTGRES_USER:-modbots}
      POSTGRES_PASSWORD: ${PRODUCTION_POSTGRES_PASSWORD:?Set PRODUCTION_POSTGRES_PASSWORD}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-modbots}
      S3_ACCESS_KEY: ${PRODUCTION_S3_ACCESS_KEY:?Set PRODUCTION_S3_ACCESS_KEY}
      S3_SECRET_KEY: ${PRODUCTION_S3_SECRET_KEY:?Set PRODUCTION_S3_SECRET_KEY}
      MODERATION_MIN_CONFIDENCE: ${MODERATION_MIN_CONFIDENCE:-0.9}
      MODERATION_ALLOWED_ACTIONS: ${MODERATION_ALLOWED_ACTIONS:-delete_message,mute_actor,unmute_actor,remove_actor}
      AUTH_MODE: ${AUTH_MODE:-optional}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      ACCOUNT_URL: ${ACCOUNT_URL:-http://account:3003}
      TRANSLATION_URL: ${TRANSLATION_URL:-http://translation:5000}
      UPPS_PUBLIC_URL: ${PRODUCTION_UPPS_PUBLIC_URL:-https://upps.modbots.ai}
      UPPS_INTERNAL_URL: http://upps:3010
      UPPS_SERVICE_TOKEN: ${UPPS_SERVICE_TOKEN:?Set UPPS_SERVICE_TOKEN}
      WEB_ORIGINS: ${PRODUCTION_WEB_ORIGINS:?Set PRODUCTION_WEB_ORIGINS to the production web origin}
    ports:
      - "${PRODUCTION_API_PORT:-8443}:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      nats:
        condition: service_started
      minio:
        condition: service_started
      upps:
        condition: service_started
      translation:
        condition: service_healthy

  realtime:
    image: ghcr.io/mod-bots/modbots-backend-realtime:${MODBOTS_IMAGE_TAG:-0.0.1-beta}
    container_name: modbots-backend-realtime
    restart: unless-stopped
    environment:
      BACKEND_URL: http://api:${PORT:-3001}
      NATS_URL: nats://nats:4222
      WEBSOCKET_PORT: 3002
      WEBTRANSPORT_PORT: 4433
      PUBLIC_WEBSOCKET_URL: ${PRODUCTION_PUBLIC_WEBSOCKET_URL:-ws://77.68.50.14:${PRODUCTION_REALTIME_PORT:-80}/v1/rooms/{roomId}}
      PUBLIC_WEBTRANSPORT_URL: ${PRODUCTION_PUBLIC_WEBTRANSPORT_URL:-https://77.68.50.14:${PRODUCTION_WEBTRANSPORT_PORT:-4433}/v1/rooms/{roomId}}
    ports:
      - "${PRODUCTION_REALTIME_PORT:-80}:3002"
      - "${PRODUCTION_WEBTRANSPORT_PORT:-4433}:4433/udp"
    depends_on:
      api:
        condition: service_started
      nats:
        condition: service_started

  runtime:
    image: ghcr.io/mod-bots/modbots-backend-runtime:${MODBOTS_IMAGE_TAG:-0.0.1-beta}
    container_name: modbots-backend-runtime
    restart: unless-stopped
    environment:
      MODBOTS_API_URL: http://api:${PORT:-3001}
      MODBOTS_REALTIME_URL: ws://realtime:3002
      MODBOTS_ROOM_ID: ${MODBOTS_ROOM_ID:-global-lobby}
      CHAT_TEMPO: ${CHAT_TEMPO:-1}
      AUTONOMOUS_INFERENCE_LIMIT_PER_HOUR: ${AUTONOMOUS_INFERENCE_LIMIT_PER_HOUR:-12}
      INTERNET_RESEARCH_LIMIT_PER_HOUR: ${INTERNET_RESEARCH_LIMIT_PER_HOUR:-4}
      INTERNET_RESEARCH_COOLDOWN_MINUTES: ${INTERNET_RESEARCH_COOLDOWN_MINUTES:-360}
      ML_URL: http://ml:8000
    volumes:
      - runtime-experience:/data/runtime
    depends_on:
      api:
        condition: service_started
      realtime:
        condition: service_started
      ml:
        condition: service_started

  account:
    image: ghcr.io/mod-bots/modbots-backend-account:${MODBOTS_IMAGE_TAG:-0.0.1-beta}
    container_name: modbots-backend-account
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3003
      BACKEND_URL: http://api:${PORT:-3001}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      ACCOUNT_ISSUER: ${PRODUCTION_ACCOUNT_ISSUER:-http://77.68.50.14:${PRODUCTION_ACCOUNT_PORT:-8447}}
      COOKIE_SECRET: ${PRODUCTION_COOKIE_SECRET:?Set PRODUCTION_COOKIE_SECRET}
      DESKTOP_REDIRECT_URI: ${DESKTOP_REDIRECT_URI:-http://127.0.0.1:53682/callback}
      WEB_REDIRECT_URI: ${PRODUCTION_WEB_REDIRECT_URI:?Set PRODUCTION_WEB_REDIRECT_URI to the production web callback URL}
    ports:
      - "${PRODUCTION_ACCOUNT_PORT:-8447}:3003"
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_started

  upps:
    image: ghcr.io/mod-bots/modbots-backend-upps:${MODBOTS_IMAGE_TAG:-0.0.1-beta}
    container_name: modbots-backend-upps
    restart: unless-stopped
    environment:
      MODBOTS_UPPS_HOST: 0.0.0.0
      MODBOTS_UPPS_PORT: 3010
      MODBOTS_UPPS_SERVICE_TOKEN: ${UPPS_SERVICE_TOKEN:?Set UPPS_SERVICE_TOKEN}
    ports:
      - "${PRODUCTION_UPPS_PORT:-3010}:3010"
    volumes:
      - upps-profile-pictures:/app/services/upps/public/profile-pictures/uploads

  ml:
    image: ghcr.io/mod-bots/modbots-backend-ml:${MODBOTS_IMAGE_TAG:-0.0.1-beta}
    container_name: modbots-backend-ml
    restart: unless-stopped
    environment:
      MODEL_ID: ${MODEL_ID:?Set MODEL_ID to the hosted model to run}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY}
      INFERENCE_TIMEOUT_SECONDS: ${INFERENCE_TIMEOUT_SECONDS:-120}

  translation:
    image: libretranslate/libretranslate:v1.9.6
    container_name: modbots-backend-translation
    restart: unless-stopped
    user: "0:0"
    entrypoint:
      [
        "sh",
        "-c",
        "mkdir -p /home/libretranslate/.local/share/argos-translate && chown -R 1032:65534 /home/libretranslate/.local/share/argos-translate && exec setpriv --reuid=1032 --regid=65534 --clear-groups /app/scripts/entrypoint.sh",
      ]
    environment:
      LT_HOST: 0.0.0.0
      LT_PORT: 5000
      LT_LOAD_ONLY: en,zh
      LT_DISABLE_WEB_UI: "true"
      LT_DISABLE_FILES_TRANSLATION: "true"
      LT_CHAR_LIMIT: 40000
      LT_BATCH_LIMIT: 50
    volumes:
      - translation-models:/home/libretranslate/.local/share/argos-translate
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/languages', timeout=5)",
        ]
      interval: 10s
      timeout: 6s
      retries: 30
      start_period: 60s

  postgres:
    image: postgres:17-alpine
    container_name: modbots-backend-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-modbots}
      POSTGRES_USER: ${POSTGRES_USER:-modbots}
      POSTGRES_PASSWORD: ${PRODUCTION_POSTGRES_PASSWORD:?Set PRODUCTION_POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-modbots} -d ${POSTGRES_DB:-modbots}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: modbots-backend-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data

  nats:
    image: nats:2.11-alpine
    container_name: modbots-backend-nats
    restart: unless-stopped
    command: ["-js", "--store_dir", "/data", "--http_port", "8222"]
    volumes:
      - nats-data:/data

  minio:
    image: minio/minio:RELEASE.2025-06-13T11-33-47Z
    container_name: modbots-backend-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${PRODUCTION_S3_ACCESS_KEY:?Set PRODUCTION_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${PRODUCTION_S3_SECRET_KEY:?Set PRODUCTION_S3_SECRET_KEY}
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
    name: modbots_postgres
  redis-data:
    name: modbots_redis
  nats-data:
    name: modbots_nats
  minio-data:
    name: modbots_minio
  translation-models:
    name: modbots_translation_models
  upps-profile-pictures:
    name: modbots_upps_profile_pictures
  runtime-experience:
    name: modbots_runtime_experience

networks:
  default:
    name: modbots
    external: true
